[project]
name = "snow"
version = "0.1.0"
description = "3D body-pose extraction from snowboarding video via the NVIDIA 3D Body Pose NIM"
requires-python = ">=3.10,<3.13"
dependencies = [
    "grpcio==1.67.1",
    "protobuf>=4.25,<6",
    "numpy>=1.26,<2",
    "opencv-python>=4.11",
    "tqdm>=4.67",
    "ultralytics>=8.3",
    "lap>=0.5",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pyarrow>=16,<17",
    "yt-dlp>=2025.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "usd-core>=24.0"]

[project.scripts]
snow = "snow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snow"]
